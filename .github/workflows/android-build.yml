name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Al-Mahalla-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.1.0-build${{ github.run_number }}"
          name: "Al-Mahalla APK v1.1.0 (Build ${{ github.run_number }})"
          files: android/app/build/outputs/apk/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
