name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" || true

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build completed"

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlMahalla-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.1.0-build${{ github.run_number }}"
          name: "Al-Mahalla APK v1.1.0 (Build ${{ github.run_number }})"
          files: |
            android/app/build/outputs/apk/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}



